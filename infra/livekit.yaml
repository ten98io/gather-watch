# ── Playin — LiveKit OSS server configuration ────────────────────────────────
# Mounted read-only into the livekit service by infra/docker-compose.yml.
#
# SECRETS: the `keys:` block below holds DEV PLACEHOLDERS ONLY (they match
# .env.example so the stack boots out of the box). In production the compose
# file passes LIVEKIT_KEYS from the root .env, which takes precedence over this
# file — never commit real keys here.

port: 7880 # WS/HTTP signalling (TCP; published by compose)

rtc:
  tcp_port: 7881            # ICE over TCP fallback (published by compose)
  port_range_start: 50000   # WebRTC/UDP media range —
  port_range_end: 50200     #   MUST match the udp port mapping in docker-compose.yml
  # Required when running behind docker bridge networking / NAT: the server
  # discovers and advertises the host's public IP in ICE candidates.
  use_external_ip: true

  # ── TURN integration: external coturn (infra/coturn/turnserver.conf) ───────
  # OPT-IN and disabled by default. The production TURN path is: the API mints
  # time-limited HMAC credentials from TURN_STATIC_AUTH_SECRET (coturn runs
  # `use-auth-secret`) and ships them to clients in RTCConfiguration — a
  # static username/credential pair here would never authenticate against
  # that mode, so LiveKit would advertise a dead relay and add failed-
  # allocation latency to ICE for clients behind hostile NATs.
  # To enable a static handout anyway: (1) replace the host placeholder with
  # your real domain (this file is NOT covered by the Caddyfile domain step —
  # see "First boot" in infra/README.md), (2) add a matching lt-cred-mech
  # user in turnserver.conf, then uncomment:
  # turn_servers:
  #   - host: playin.example.com # public hostname (or IP) where coturn's 3478/udp is reachable
  #     port: 3478
  #     protocol: udp
  #     username: playin
  #     credential: devsecret-at-least-32-characters-long

# Built-in TURN stays off — coturn is the relay for this stack.
turn:
  enabled: false

# API keys — dev placeholders matching .env.example.
# Overridden at runtime by the LIVEKIT_KEYS env var set in docker-compose.yml.
keys:
  devkey: devsecret-at-least-32-characters-long

# Room defaults (spec: rooms persist server-side in Mongo; LiveKit rooms are
# ephemeral media sessions on top of them).
room:
  auto_create: true
  empty_timeout: 300    # seconds an empty media room lingers before cleanup
  max_participants: 0   # 0 = unlimited; app-level policy caps AV publishers at 12

logging:
  level: info
  json: true
