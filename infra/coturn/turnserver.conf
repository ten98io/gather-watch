# ── Gather — coturn configuration ────────────────────────────────────────────
# Mounted read-only into the coturn service by infra/docker-compose.yml.

# Listeners (published 1:1 by compose)
listening-port=3478
tls-listening-port=5349

# ── Auth: time-limited HMAC credentials (shared secret) ──────────────────────
# coturn config files CANNOT read environment variables, so the secret is NOT
# written here. docker-compose.yml injects it as a CLI flag, which overrides
# this file:
#
#   --static-auth-secret=${TURN_STATIC_AUTH_SECRET}
#
# Keep TURN_STATIC_AUTH_SECRET in the root .env only. The line below is left
# commented as documentation of the effective setting:
# static-auth-secret=devsecret-at-least-32-characters-long
use-auth-secret

realm=gather.local

# ── Relay port range ──────────────────────────────────────────────────────────
# MUST match the "49160-49200:49160-49200/udp" mapping on the coturn service in
# infra/docker-compose.yml (kept deliberately small: docker userland-proxies
# each mapped port; use network_mode: host for bigger ranges).
min-port=49160
max-port=49200

# ── Hardening ────────────────────────────────────────────────────────────────
fingerprint
no-cli
no-multicast-peers
no-loopback-peers
# TLS relay is available on 5349 once you mount certs and set cert/pkey below;
# until then coturn simply won't answer TLS (UDP/TCP 3478 still works).
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Standard denial of RFC1918/link-local peer relays. NOTE: only enable these if
# LiveKit is reached via its PUBLIC address from the relay's point of view —
# with the default bridge-network compose setup, relayed traffic targets the
# host's public IP, so these are safe to enable on a real deployment:
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255
# denied-peer-ip=169.254.0.0-169.254.255.255

# Quotas — generous defaults; tune per deployment.
total-quota=1200
user-quota=50
